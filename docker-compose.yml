# 로컬 개발용 Postgres. 호스트 5432는 Homebrew Postgres와 겹칠 수 있어 5433으로 연다.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grantdesk
      POSTGRES_PASSWORD: grantdesk
      POSTGRES_DB: grantdesk
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantdesk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
