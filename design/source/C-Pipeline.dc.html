<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C안 · 파이프라인 보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5FA}
a{color:#2D5BE3;text-decoration:none}a:hover{color:#1E46C2}
::selection{background:#E2DAFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #2D5BE3;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; position: relative; background: #F4F5FA; font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; color: #191C24; word-break: keep-all; overflow: hidden">

  <!-- 주인공: 상단 파스텔 그라데이션 (이 안 하나뿐) -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 420px; background: linear-gradient(115deg, #C9D8FF 0%, #DCCFFF 48%, #FAD3EC 100%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 300px; height: 120px; background: linear-gradient(180deg, rgba(244,245,250,0) 0%, #F4F5FA 100%)"></div>

  <div style="position: relative; max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 0 40px 72px">

    <header style="height: 72px; display: flex; align-items: center; gap: 24px">
      <span style="font-size: 16px; font-weight: 800">지원사업 데스크</span>
      <nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
        <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.7); color: #191C24; font-size: 14px; font-weight: 600; display: flex; align-items: center">보드</a>
        <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; color: #3A3F4C; font-size: 14px; display: flex; align-items: center">전체 공고</a>
        <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; color: #3A3F4C; font-size: 14px; display: flex; align-items: center">지원 이력</a>
        <a href="#" style="height: 36px; padding: 0 14px; border-radius: 18px; color: #3A3F4C; font-size: 14px; display: flex; align-items: center">회사 프로필</a>
      </nav>
      <button type="button" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 0; background: #191C24; color: #FFFFFF; font-size: 14px; font-weight: 600">새 공고 가져오기</button>
    </header>

    <section style="padding: 48px 0 40px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 12px; max-width: 720px">
        <span style="font-size: 15px; font-weight: 600; color: #3A3F8C">11월 23일 월요일</span>
        <h1 style="margin: 0; font-size: 52px; line-height: 1.2; font-weight: 800; letter-spacing: -0.04em">12월 8일까지<br>제출할 공고 2건</h1>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <div style="padding: 16px 20px; border-radius: 20px; background: rgba(255,255,255,0.62); backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 4px; min-width: 120px">
          <span style="font-size: 13px; color: #4A5060">이번 달 제출</span>
          <span style="font-size: 26px; font-weight: 800">1<span style="font-size: 15px; font-weight: 600; color: #4A5060"> / 4건</span></span>
        </div>
        <div style="padding: 16px 20px; border-radius: 20px; background: rgba(255,255,255,0.62); backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 4px; min-width: 120px">
          <span style="font-size: 13px; color: #4A5060">리뷰 대기</span>
          <span style="font-size: 26px; font-weight: 800">2<span style="font-size: 15px; font-weight: 600; color: #4A5060">건</span></span>
        </div>
      </div>
    </section>

    <!-- 보드 -->
    <section aria-label="진행 보드" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
        <div style="box-sizing: border-box; padding: 16px; border-radius: 24px; background: rgba(255,255,255,0.55); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.7); display: flex; flex-direction: column; gap: 12px; min-width: 220px">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
              <span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.dot}}"></span>{{c.name}}</span>
            <span style="font-size: 13px; font-weight: 600; color: #4A5060">{{c.count}}</span>
          </div>
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
            <a href="#" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(25,28,36,0.05); color: #191C24; opacity: {{k.opacity}}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
                <span style="font-size: 15px; font-weight: 700; line-height: 1.45">{{k.title}}</span>
                <span style="flex: none; font-size: 15px; font-weight: 800; color: {{k.scoreColor}}">{{k.score}}</span>
              </div>
              <span style="font-size: 12px; color: #6B7183">{{k.org}}</span>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="height: 4px; border-radius: 2px; background: #ECEEF3">
                  <div style="width: {{k.progressW}}; height: 4px; border-radius: 2px; background: {{k.barColor}}"></div>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center">
                  <span style="font-size: 12px; font-weight: 700; color: {{k.ddayColor}}">{{k.dday}}</span>
                  <span style="width: 24px; height: 24px; border-radius: 12px; background: #EEF0F6; color: #3A3F4C; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{k.who}}</span>
                </div>
              </div>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    function card(o) {
      return Object.assign({}, o, {
        opacity: o.done ? '0.7' : '1',
        scoreColor: o.score >= 85 ? '#2D5BE3' : '#3A3F4C',
        progressW: o.progress + '%',
        barColor: o.urgent ? '#E8590C' : (o.done ? '#1F9D63' : '#2D5BE3'),
        ddayColor: o.urgent ? '#B4480A' : (o.done ? '#1F7A4D' : '#3A3F4C')
      });
    }
    var cols = [
      { name: '추천됨', dot: '#2D5BE3', cards: [
        card({ title: '2027년 AI 바우처 공급기업 모집', org: '정보통신산업진흥원', score: 88, progress: 0, dday: '12.01 접수 시작', who: '-' }),
        card({ title: '2027년 데이터바우처 공급기업', org: '한국데이터산업진흥원', score: 79, progress: 0, dday: '11.25 접수 시작', who: '-' }),
        card({ title: '청년창업사관학교 17기', org: '중소벤처기업진흥공단', score: 74, progress: 0, dday: '12.03 접수 시작', who: '-' })
      ] },
      { name: '초안 작성', dot: '#7B5CF6', cards: [
        card({ title: '2027년 초기창업패키지', org: '창업진흥원 · 사업계획서 6/9', score: 92, progress: 17, dday: 'D-15', who: 'YC' })
      ] },
      { name: '리뷰', dot: '#E8590C', cards: [
        card({ title: '부산 SW기업 성장지원사업', org: '부산정보산업진흥원', score: 85, progress: 55, dday: 'D-5', who: 'EL', urgent: true })
      ] },
      { name: '제출 완료', dot: '#1F9D63', cards: [
        card({ title: '부산 스타트업 실증 지원사업', org: '부산창조경제혁신센터 · 결과 대기', score: 81, progress: 100, dday: '11.14 제출', who: 'YC', done: true })
      ] }
    ];
    cols = cols.map(function (c) { return Object.assign({}, c, { count: c.cards.length }); });
    return { cols: cols };
  }
}
</script>
</body>
</html>
